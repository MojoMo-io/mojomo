<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOJOMO Support Dashboard</title>
<meta name="robots" content="noindex">
<style>
:root{--paper:#F6F3EE;--paper-2:#EDE8E0;--ink:#151515;--ink-2:#3C3A36;--muted:#7A746B;--line:rgba(21,21,21,.14);--line-2:rgba(21,21,21,.28);--accent:#9A7B4F;--danger:#7A2E2E;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:24px}
.bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}
h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:36px 0 12px}
button{cursor:pointer;font:inherit}
.linklike{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
tr:hover td{background:var(--paper-2)}
.panel{background:#fff;border:1px solid var(--line);border-radius:4px;padding:18px;margin-top:10px}
input,textarea{width:100%;border:1px solid var(--line-2);border-radius:3px;padding:8px;font:inherit;margin-top:4px}
label{display:block;margin-top:12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--ink);color:#fff;border:0;padding:9px 16px;border-radius:3px;font-size:12px;letter-spacing:.05em;margin-top:14px}
.btn:hover{background:var(--accent)}
.row{display:flex;gap:24px;flex-wrap:wrap}
.col{flex:1;min-width:320px}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.chip{display:inline-block;font-size:10px;padding:2px 6px;border:1px solid var(--line-2);border-radius:3px;margin-left:6px}
.err{color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>MOJOMO Support Dashboard</h1>
    <div><code id="whoami">—</code> <button class="linklike" id="signOut">Sign out</button></div>
  </div>

  <h2>Users &amp; avatars</h2>
  <div class="panel"><table id="usersTable"><thead><tr><th>Email</th><th>Avatars</th><th>Admin</th><th>Since</th></tr></thead><tbody></tbody></table></div>

  <h2>Avatar detail</h2>
  <div class="panel" id="avatarDetail"><p class="note">Click a user above to see their avatars, then an avatar to edit it.</p></div>

  <h2>NPC / public-figure avatars</h2>
  <div class="panel">
    <table id="npcTable"><thead><tr><th>Name</th><th>Support?</th><th>Bio</th></tr></thead><tbody></tbody></table>
    <div class="row" style="margin-top:20px">
      <div class="col">
        <label>Name</label><input id="npcName">
        <label>Bio (shown to users)</label><input id="npcBio">
        <label>System prompt (personality)</label><textarea id="npcPrompt" rows="6"></textarea>
        <label><input type="checkbox" id="npcSupport" style="width:auto;display:inline"> This is the support avatar</label>
        <button class="btn" id="npcCreate">Create NPC avatar</button>
        <div class="note err" id="npcErr"></div>
      </div>
    </div>
  </div>

  <h2>Support conversations</h2>
  <div class="panel">
    <label>User's avatar ID to reach out to</label>
    <input id="supportAvatarId" placeholder="Paste an avatar UUID from the table above">
    <button class="btn" id="supportLaunch">Launch support conversation</button>
    <div class="note" id="supportResult"></div>
  </div>

  <h2>Matchmaking hints (platform-wide)</h2>
  <div class="panel"><table id="hintsTable"><thead><tr><th>Avatar</th><th>Suggested</th><th>Reason</th><th>Status</th></tr></thead><tbody></tbody></table></div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function api(method, path, body) {
    const res = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 || res.status === 403) { location.replace('/login'); throw new Error('Not authorized'); }
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  async function init() {
    try { const me = await api('GET', '/api/auth/me'); $('whoami').textContent = me.email; }
    catch { return; }
    loadUsers(); loadNpcs(); loadHints();
  }
  $('signOut').onclick = async () => { try { await api('POST', '/api/auth/logout'); } catch {} location.replace('/login'); };

  async function loadUsers() {
    const users = await api('GET', '/api/admin/users').catch(() => []);
    const tb = $('usersTable').querySelector('tbody'); tb.innerHTML = '';
    for (const u of users) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${esc(u.email)}</td><td>${u.avatar_count}</td><td>${u.is_admin ? 'yes' : ''}</td><td>${new Date(u.created_at).toLocaleDateString()}</td>`;
      tr.style.cursor = 'pointer';
      tr.onclick = () => showUser(u.id);
      tb.appendChild(tr);
    }
  }

  async function showUser(userId) {
    const { user, avatars } = await api('GET', `/api/admin/users/${userId}`);
    const box = $('avatarDetail');
    box.innerHTML = `<p><strong>${esc(user.email)}</strong></p>`;
    for (const a of avatars) {
      const d = document.createElement('div'); d.className = 'panel';
      d.innerHTML = `<strong>${esc(a.name)}</strong> <span class="chip">${esc(a.id)}</span>${a.is_npc ? ' <span class="chip">NPC</span>' : ''}
        <p class="note">${esc(a.bio || 'no bio')}</p>
        <label>Bio</label><input data-bio value="${esc(a.bio || '')}">
        <label>System prompt</label><textarea data-prompt rows="4">${esc(a.system_prompt || '')}</textarea>
        <button class="btn" data-save>Save</button>
        <div class="note">Personality profile: ${a.personality_profile ? esc(a.personality_profile.summary || '') : 'not built yet'}</div>`;
      d.querySelector('[data-save]').onclick = async () => {
        await api('PATCH', `/api/admin/avatars/${a.id}`, { bio: d.querySelector('[data-bio]').value, system_prompt: d.querySelector('[data-prompt]').value });
        alert('Saved');
      };
      box.appendChild(d);
    }
  }

  async function loadNpcs() {
    const npcs = await api('GET', '/api/admin/npc-avatars').catch(() => []);
    const tb = $('npcTable').querySelector('tbody'); tb.innerHTML = '';
    for (const n of npcs) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${esc(n.name)}</td><td>${n.is_support ? 'yes' : ''}</td><td>${esc(n.bio || '')}</td>`;
      tb.appendChild(tr);
    }
  }
  $('npcCreate').onclick = async () => {
    const name = $('npcName').value.trim(), bio = $('npcBio').value.trim(), system_prompt = $('npcPrompt').value.trim(), is_support = $('npcSupport').checked;
    $('npcErr').textContent = '';
    if (name.length < 2 || system_prompt.length < 20) { $('npcErr').textContent = 'Name and a real system prompt (20+ chars) are required.'; return; }
    try {
      await api('POST', '/api/admin/npc-avatars', { name, bio: bio || undefined, system_prompt, is_support });
      $('npcName').value = ''; $('npcBio').value = ''; $('npcPrompt').value = ''; $('npcSupport').checked = false;
      loadNpcs();
    } catch (e) { $('npcErr').textContent = e.message; }
  };

  $('supportLaunch').onclick = async () => {
    const id = $('supportAvatarId').value.trim();
    const box = $('supportResult'); box.textContent = '';
    try { const c = await api('POST', '/api/admin/support-conversations', { user_avatar_id: id }); box.textContent = `Started conversation ${c.id}`; }
    catch (e) { box.textContent = e.message; box.className = 'note err'; }
  };

  async function loadHints() {
    const hints = await api('GET', '/api/admin/hints').catch(() => []);
    const tb = $('hintsTable').querySelector('tbody'); tb.innerHTML = '';
    for (const h of hints) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${esc(h.avatar_name)}</td><td>${esc(h.suggested_avatar_name)}</td><td>${esc(h.reason)}</td><td>${esc(h.status)}</td>`;
      tb.appendChild(tr);
    }
  }

  init();
})();
</script>
</body>
</html>
